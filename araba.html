
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON RACER</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080817;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
 touch-action:none;
}
canvas{display:block;width:100vw;height:100vh}
#hud{
 position:fixed;top:15px;left:15px;right:15px;
 display:flex;justify-content:space-between;
 pointer-events:none;z-index:2;
}
.panel{
 background:#10152ddd;border:1px solid #00f5ff;
 padding:12px 17px;border-radius:12px;
 box-shadow:0 0 15px #00eaff55;
}
.panel strong{color:#00f5ff;font-size:22px}
#menu{
 position:fixed;inset:0;display:flex;
 align-items:center;justify-content:center;
 background:#050514dd;z-index:5;text-align:center;
}
.card{
 width:min(90%,420px);padding:30px;
 background:#10152b;border:2px solid #00f5ff;
 border-radius:22px;box-shadow:0 0 40px #00d9ff55;
}
h1{font-size:42px;color:#00f5ff;text-shadow:0 0 20px #00f5ff}
button{
 border:0;padding:15px 30px;border-radius:12px;
 background:#00eaff;color:#00121a;font-weight:bold;
 font-size:18px;cursor:pointer;margin-top:15px;
}
button:active{transform:scale(.95)}
#controls{
 position:fixed;bottom:25px;left:0;right:0;
 display:flex;justify-content:space-between;
 padding:0 25px;pointer-events:none;
}
.ctrl{
 pointer-events:auto;width:75px;height:65px;
 border:2px solid #00eaff;background:#10152baa;
 color:white;border-radius:15px;font-size:28px;
}
#nitroBtn{width:110px;color:#ffce00;border-color:#ffce00}
.small{color:#aab8d0;font-size:13px;line-height:1.7}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="panel">SKOR<br><strong id="score">0</strong></div>
 <div class="panel">HIZ<br><strong id="speed">0</strong> KM/H</div>
 <div class="panel">REKOR<br><strong id="best">0</strong></div>
</div>

<div id="menu">
 <div class="card">
  <h1>NEON RACER</h1>
  <p>🚗 Şehrin en çılgın yarışına hazır mısın?</p>
  <p class="small">
   Arabalara çarpma!<br>
   Trafikten kaç, nitronu kullan ve rekor kır!
  </p>
  <button onclick="startGame()">YARIŞA BAŞLA 🚀</button>
  <p class="small">← → / A D : Direksiyon<br>SPACE : Nitro | P : Duraklat</p>
 </div>
</div>

<div id="controls">
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="nitroBtn">⚡ NİTRO</button>
 <button class="ctrl" id="right">▶</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,roadX,roadW;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
 roadW=Math.min(W*.72,500);
 roadX=(W-roadW)/2;
}
addEventListener("resize",resize);
resize();

let running=false,paused=false;
let score=0,best=Number(localStorage.getItem("neonBest")||0);
let speed=5,frame=0,lines=0;
let nitro=false,crashed=false;
let keys={};
let particles=[];
let enemies=[];
let player={x:W/2,y:H*.78,w:42,h:75};
document.getElementById("best").textContent=best;

function startGame(){
 score=0;speed=5;frame=0;lines=0;
 enemies=[];particles=[];
 player.x=W/2;
 running=true;paused=false;crashed=false;
 document.getElementById("menu").style.display="none";
}

function gameOver(){
 running=false;crashed=true;
 best=Math.max(best,Math.floor(score));
 localStorage.setItem("neonBest",best);
 document.getElementById("best").textContent=best;
 document.querySelector("#menu h1").textContent="💥 KAZA YAPTIN!";
 document.querySelector("#menu p").textContent=
 "Skorun: "+Math.floor(score)+" | Rekor: "+best;
 document.querySelector("#menu button").textContent="TEKRAR OYNA 🔥";
 document.getElementById("menu").style.display="flex";
}

function drawCar(x,y,w,h,color,enemy=false){
 ctx.save();
 ctx.translate(x,y);

 // Gölge
 ctx.fillStyle="#0008";
 ctx.fillRect(-w/2+4,5,w,h);

 // Tekerlekler
 ctx.fillStyle="#090910";
 ctx.fillRect(-w/2-4,12,7,19);
 ctx.fillRect(w/2-3,12,7,19);
 ctx.fillRect(-w/2-4,h-30,7,19);
 ctx.fillRect(w/2-3,h-30,7,19);

 // Gövde
 ctx.fillStyle=color;
 ctx.shadowBlur=18;
 ctx.shadowColor=color;
 ctx.beginPath();
 ctx.roundRect(-w/2,0,w,h,9);
 ctx.fill();

 // Cam
 ctx.shadowBlur=0;
 ctx.fillStyle="#122e48";
 ctx.beginPath();
 ctx.roundRect(-w*.34,13,w*.68,21,5);
 ctx.fill();

 ctx.fillStyle="#284e67";
 ctx.fillRect(-w*.32,39,w*.64,12);

 // Farlar
 ctx.fillStyle=enemy?"#ff2222":"#00ffff";
 ctx.fillRect(-w*.38,h-8,w*.22,5);
 ctx.fillRect(w*.16,h-8,w*.22,5);

 if(!enemy){
  ctx.fillStyle="#fff";
  ctx.fillRect(-w*.4,3,7,4);
  ctx.fillRect(w*.23,3,7,4);
 }
 ctx.restore();
}

function drawRoad(){
 ctx.fillStyle="#101018";
 ctx.fillRect(0,0,W,H);

 // Şehir ışıkları
 for(let i=0;i<12;i++){
  let y=(i*110+frame*speed*1.5)%(H+100)-50;
  ctx.fillStyle="#171a32";
  ctx.fillRect(roadX-65,y,35,65);
  ctx.fillRect(roadX+roadW+30,y,35,65);
  ctx.fillStyle="#00d9ff55";
  for(let j=0;j<3;j++){
   ctx.fillRect(roadX-55,y+j*17,7,7);
   ctx.fillRect(roadX+roadW+40,y+j*17,7,7);
  }
 }

 // Yol
 ctx.fillStyle="#272735";
 ctx.fillRect(roadX,0,roadW,H);

 // Kenar neonları
 ctx.fillStyle="#00efff";
 ctx.fillRect(roadX,0,5,H);
 ctx.fillRect(roadX+roadW-5,0,5,H);

 // Şeritler
 for(let i=1;i<3;i++){
  let x=roadX+roadW*i/3;
  for(let y=-100+(lines%100);y<H;y+=100){
   ctx.fillStyle="#ffffff99";
   ctx.fillRect(x-2,y,4,48);
  }
 }
 lines+=speed;
}

function spawnEnemy(){
 let lane=Math.floor(Math.random()*3);
 let x=roadX+roadW*(lane+.5)/3;
 let colors=["#ff3155","#ffb000","#a855ff","#32ff79","#ffffff"];
 enemies.push({
  x,y:-100,w:40,h:70,
  color:colors[Math.floor(Math.random()*colors.length)],
  extra:Math.random()*2
 });
}

function explosion(x,y){
 for(let i=0;i<35;i++){
  particles.push({
   x,y,
   vx:(Math.random()-.5)*12,
   vy:(Math.random()-.5)*12,
   life:40,
   color:["#ff3b00","#ffdf00","#00eaff"][i%3]
  });
 }
}

function update(){
 if(!running||paused)return;

 frame++;
 score+=speed*.12;
 speed=Math.min(17,5+score/450);
 nitro=!!keys[" "]||nitroTouch;

 let boost=nitro?1.8:1;
 let move=speed*boost;

 if(keys.ArrowLeft||keys.a)player.x-=7;
 if(keys.ArrowRight||keys.d)player.x+=7;

 player.x=Math.max(roadX+35,Math.min(roadX+roadW-35,player.x));

 if(frame%Math.max(22,Math.floor(75-speed*3))===0)
  spawnEnemy();

 enemies.forEach(e=>e.y+=move+e.extra);

 enemies=enemies.filter(e=>e.y<H+100);

 for(let e of enemies){
  if(Math.abs(e.x-player.x)<35 &&
     Math.abs(e.y-player.y)<62){
   explosion(player.x,player.y);
   gameOver();
  }
 }

 particles.forEach(p=>{
  p.x+=p.vx;p.y+=p.vy;
  p.life--;
 });
 particles=particles.filter(p=>p.life>0);

 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("speed").textContent=Math.floor(speed*20*boost);
}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawRoad();

 enemies.forEach(e=>drawCar(e.x,e.y,e.w,e.h,e.color,true));

 // Nitro alevi
 if(nitro&&running&&!paused){
  ctx.fillStyle="#00eaff";
  ctx.shadowBlur=25;ctx.shadowColor="#00eaff";
  ctx.beginPath();
  ctx.moveTo(player.x-12,player.y+65);
  ctx.lineTo(player.x,player.y+105+Math.random()*20);
  ctx.lineTo(player.x+12,player.y+65);
  ctx.fill();
  ctx.shadowBlur=0;
 }

 drawCar(player.x,player.y,player.w,player.h,"#00eaff");

 particles.forEach(p=>{
  ctx.globalAlpha=p.life/40;
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x,p.y,7,7);
 });
 ctx.globalAlpha=1;

 if(paused){
  ctx.fillStyle="#0009";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="white";ctx.font="bold 40px Arial";
  ctx.textAlign="center";
  ctx.fillText("DURAKLATILDI",W/2,H/2);
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}
loop();

addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(e.key===" ")e.preventDefault();
 if(e.key.toLowerCase()==="p"&&running)paused=!paused;
});
addEventListener("keyup",e=>keys[e.key]=false);

let nitroTouch=false;

function hold(id,down,up){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();down();
 });
 el.addEventListener("pointerup",up);
 el.addEventListener("pointerleave",up);
 el.addEventListener("pointercancel",up);
}
hold("left",()=>keys.ArrowLeft=true,()=>keys.ArrowLeft=false);
hold("right",()=>keys.ArrowRight=true,()=>keys.ArrowRight=false);
hold("nitroBtn",()=>nitroTouch=true,()=>nitroTouch=false);

</script>
</body>
</html>
